<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>書店經營手帳 v2.2</title><style> *{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f5f1e8;color:#343d36;margin:0}main{max-width:1000px;margin:auto;padding:22px}h1{margin:0}h2{font-size:20px}section{background:#fffdf8;border:1px solid #e1dacb;border-radius:16px;padding:20px;margin:18px 0}button,input,select{font:inherit;border:1px solid #c9c9be;border-radius:8px;padding:9px;background:white;color:inherit}button{cursor:pointer}button.primary,button.active{background:#416b59;color:white;border-color:#416b59}.fields{display:flex;flex-wrap:wrap;gap:12px}.fields label{display:grid;gap:5px;flex:1;min-width:90px}input{width:100%;min-width:0}.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;margin:16px 0}.books label{display:grid;gap:5px}.bar{height:12px;border-radius:8px;background:#eee;overflow:hidden}.bar i{display:block;height:100%}.line{display:grid;grid-template-columns:55px 1fr 65px 65px;gap:10px;align-items:center;margin:12px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:14px}th,td{text-align:right;padding:9px;border-bottom:1px solid #e8e3d9}th:first-child,td:first-child{text-align:left}small,p{color:#62695f} .actions{display:flex;gap:8px;flex-wrap:wrap} #msg{color:#416b59} @media(max-width:500px){main{padding:12px}section{padding:14px}.line{grid-template-columns:45px 1fr 48px 48px;gap:6px}}[hidden]{display:none!important}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{flex:1} .bookrow{display:grid;grid-template-columns:1fr 100px 60px;gap:12px;align-items:center;margin:8px 0}.bookrow input[type=checkbox]{width:22px;height:22px;margin:auto;accent-color:#416b59}.notice{padding:10px;background:#f5f1e8;border-radius:8px}button:disabled{opacity:.45;cursor:default} .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px} .pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px} .danger{color:#a33} #custom{max-width:150px} @media(min-width:800px){.daily{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.daily section{margin:0}} .daily{margin-top:18px}</style></head><body><main><h1>📚 書店經營手帳</h1><p>每日銷售紀錄與選書建議 · v2.2</p><p id="storage" role="status" class="notice"></p><nav id="nav"><button data-tab="daily" class="active">每日營業</button><button data-tab="analysis">銷售分析</button><button data-tab="history">歷史紀錄</button></nav>
<div id="daily" class="daily"><section><h2>攜帶書籍試算</h2><div class="fields"><label>季節<select id="targetSeason"></select></label><label>地點<select id="target"></select></label><label>星期<select id="targetWeek"></select></label></div><p>攜帶總數</p><div class="actions" id="sizes"><button data-size="40" class="active">40 本</button><button data-size="60">60 本</button><button data-size="80">80 本</button><button data-size="custom">自訂</button></div><label id="customLabel" hidden>自訂總量 <input id="custom" type="number" min="14" max="1000000" step="1" value="100" required></label><p id="summary" class="notice"></p><div id="recommend"></div><small>每種至少 2 本；售罄紀錄僅在推薦時加權 50%。指定星期時，優先使用同季節同星期，其次同星期；無符合紀錄則回退至原有推薦方式。</small></section>
<section><h2 id="formtitle">新增銷售紀錄</h2><form id="entry"><div class="fields"><label>年份<input id="year" type="number" min="1" step="1" value="1" required></label><label>季節<select id="season" required></select></label><label>日期<input id="day" type="number" min="1" step="1" value="1" required></label><label>星期<select id="week"></select></label></div><div class="fields" style="margin-top:12px"><label>營業地點<select id="place" required></select></label></div><button type="button" id="addPlace" style="margin-top:8px">＋ 新增地點</button> <button type="button" id="managePlace">地點管理</button><div id="placeManager" hidden class="notice"><h3>地點管理</h3><div id="placeList"></div><button type="button" id="closePlaces">關閉</button></div><div class="bookrow"><small>書籍類型</small><small>實際銷量</small><small>售罄</small></div><div id="inputs"></div><p>銷售總量：<strong id="soldTotal">0</strong> 本</p><div class="actions"><button class="primary" type="submit">儲存紀錄</button><button type="button" id="cancel" hidden>取消編輯</button></div></form><p id="msg" role="status"></p></section></div>
<div id="analysis" hidden><section><h2>銷售分析</h2><div class="fields" id="af"></div><p id="overview"></p><div class="scroll" id="stats"></div><h2>書籍銷售比例與售罄次數</h2><div id="shares"></div></section></div>
<div id="history" hidden><section><h2>歷史銷售紀錄</h2><div class="fields" id="hf"></div><div class="fields" style="margin:12px 0"><label>每頁筆數<select id="pageSize"><option>10</option><option>20</option></select></label></div><div class="scroll" id="records"></div><div class="pagination"><button id="prev">上一頁</button><span id="pageInfo"></span><button id="next">下一頁</button></div></section><section><h2>資料備份</h2><div class="actions"><button id="export">匯出 JSON 備份</button><button id="csv">匯出 CSV</button><button id="import">匯入 JSON 備份</button><input type="file" id="file" accept=".json,application/json" hidden></div><p>資料僅儲存在目前瀏覽器。更換裝置、瀏覽器、檔案位置或清除資料可能無法讀取。請定期備份；匯入會取代目前資料。</p></section></div></main><script>
const types=['犯罪','戲劇','資料','奇幻','經典','兒童','旅行'],colors=['#d96360','#56b6a6','#91989d','#9466ac','#c6a46b','#8ba65d','#687dc2'],base=['海濱廣場','自由咖啡館','跳蚤市場','美家超市'],seasons=['春季','夏季','秋季','冬季'];
const weeks=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
const $=id=>document.getElementById(id),sum=a=>a.reduce((x,y)=>x+y,0),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),key='book-sales-v2';
let rows=[],places=[...base],inactive=[],editing=null,mode='40',page=1,tab='daily';
const validInt=(n,min=0)=>Number.isSafeInteger(n)&&n>=min, dateKey=r=>[r.year,r.season,r.day].join('/');
function validate(data){let a=Array.isArray(data)?data:data?.rows;let p=Array.isArray(data)?[]:data?.places;if(!Array.isArray(a)||!Array.isArray(p)||!p.every(x=>typeof x==='string'&&x.trim()))throw Error('格式錯誤');if(!a.every(r=>r&&typeof r.id==='string'&&validInt(r.year,1)&&seasons.includes(r.season)&&validInt(r.day,1)&&(r.week===undefined||r.week===''||weeks.includes(r.week))&&typeof r.place==='string'&&r.place.trim()&&Array.isArray(r.v)&&r.v.length===7&&r.v.every(x=>validInt(x))&&(r.out===undefined||(Array.isArray(r.out)&&r.out.length===7&&r.out.every((x,i)=>typeof x==='boolean'&&(!x||r.v[i]>0))))))throw Error('紀錄格式錯誤');if(new Set(a.map(r=>r.id)).size!==a.length||new Set(a.map(dateKey)).size!==a.length)throw Error('重複紀錄');return {rows:a.map(r=>({...r,week:r.week??'',out:r.out??Array(7).fill(false)})),places:[...new Set([...p,...a.map(r=>r.place)])],inactive:Array.isArray(data?.inactive)?data.inactive.filter(x=>p.includes(x)||a.some(r=>r.place===x)):[]}}
function status(t){$('storage').textContent=t}try{let s=localStorage.getItem(key);if(s){let d=validate(JSON.parse(s));rows=d.rows;places=d.places;inactive=d.inactive}localStorage.setItem(key,JSON.stringify({rows,places,inactive}));status('本機儲存已啟用｜建議定期匯出 JSON 備份。')}catch(e){status('無法讀取或寫入本機儲存，請使用 JSON 備份。')}
function save(){try{localStorage.setItem(key,JSON.stringify({rows,places,inactive}));status('已儲存至目前瀏覽器｜建議定期備份。');return true}catch(e){status('本機儲存失敗！目前資料僅在此頁面，請立即匯出 JSON。');return false}}
function options(id,values,all=false){let el=$(id),old=el.value;el.innerHTML=(all?'<option value="">全部</option>':'')+values.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if([...el.options].some(o=>o.value===old))el.value=old}
for(let id of ['season','targetSeason']){options(id,seasons);$(id).value='夏季'}
options('week',['未設定',...weeks]);options('targetWeek',weeks,true);
for(let prefix of ['a','h']){$(prefix+'f').innerHTML=[['Year','年份'],['Season','季節'],['Place','地點'],['Week','星期']].map(([id,label])=>`<label>${label}<select id="${prefix+id}"></select></label>`).join('');for(let suffix of ['Year','Season','Place','Week'])$(prefix+suffix).onchange=()=>{page=1;renderReports()}}
$('inputs').innerHTML=types.map((t,i)=>`<div class="bookrow"><label for="v${i}"><i class="dot" style="background:${colors[i]}"></i>${t}</label><input aria-label="${t}銷量" id="v${i}" type="number" min="0" step="1" value="0" required><input aria-label="${t}售罄" id="o${i}" type="checkbox"></div>`).join('');
function switchTab(t){tab=t;for(let id of ['daily','analysis','history'])$(id).hidden=id!==t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t))}$('nav').onclick=e=>{if(e.target.dataset.tab)switchTab(e.target.dataset.tab)};
function aggregate(a){return {n:a.length,v:types.map((_,i)=>sum(a.map(r=>r.v[i]))),out:types.map((_,i)=>sum(a.map(r=>+r.out[i])))}}
function allocate(weights,total){let s=sum(weights);if(!s){weights=types.map(()=>1);s=7}let exact=weights.map(w=>w/s*(total-14)),f=exact.map(Math.floor),order=exact.map((_,i)=>i).sort((i,j)=>(exact[j]-f[j])-(exact[i]-f[i])||i-j);return f.map((v,i)=>2+v+(order.slice(0,total-14-sum(f)).includes(i)?1:0))}
function calc(){if(!$('target').value){$('summary').textContent='請先新增或啟用地點。';$('recommend').innerHTML='';return}let total=mode==='custom'?Number($('custom').value):Number(mode);if(!validInt(total,14)||total>1000000){$('summary').textContent='請輸入 14 至 1,000,000 的整數。';$('recommend').innerHTML='';return}let a=rows.filter(r=>r.place===$('target').value),b=a.filter(r=>r.season===$('targetSeason').value),c=$('targetWeek').value?b.filter(r=>r.week===$('targetWeek').value):[],d=$('targetWeek').value?a.filter(r=>r.week===$('targetWeek').value):[],chosen=c.length?c:d.length?d:b.length?b:a,w=types.map((_,i)=>sum(chosen.map(r=>r.v[i]*(r.out[i]?1.5:1)))),s=sum(w),counts=allocate(w,total);$('summary').textContent=(c.length?'同地點、同季節、同星期':d.length?'同地點、同星期':b.length?'同地點、同季節':a.length?'同地點全部季節':'新地點')+'｜'+chosen.length+' 筆紀錄'+(!s?'｜平均分配':'｜依加權銷量分配');$('recommend').innerHTML=types.map((t,i)=>`<div class="line"><span>${t}</span><div class="bar"><i style="width:${counts[i]/Math.max(...counts)*100}%;background:${colors[i]}"></i></div><small>${s?(w[i]/s*100).toFixed(1)+'%':'—'}</small><strong>${counts[i]} 本</strong></div>`).join('')+`<p>合計：<strong>${sum(counts)} 本</strong></p>`}
$('targetWeek').onchange=$('target').onchange=$('targetSeason').onchange=$('custom').oninput=calc;$('sizes').onclick=e=>{if(!e.target.dataset.size)return;mode=e.target.dataset.size;$('customLabel').hidden=mode!=='custom';document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b.dataset.size===mode));calc()};
function refresh(){options('target',places.filter(p=>!inactive.includes(p)));options('place',places.filter(p=>!inactive.includes(p)||rows.some(r=>r.id===editing&&r.place===p)));renderPlaces();for(let p of ['a','h']){options(p+'Year',[...new Set(rows.map(r=>r.year))].sort((a,b)=>a-b),true);options(p+'Season',seasons,true);options(p+'Place',places,true);options(p+'Week',[...weeks,'未設定'],true)}calc();renderReports()}
function filter(p){return rows.filter(r=>(!$(p+'Year').value||r.year===Number($(p+'Year').value))&&(!$(p+'Season').value||r.season===$(p+'Season').value)&&(!$(p+'Place').value||r.place===$(p+'Place').value)&&(!$(p+'Week').value||(r.week||'未設定')===$(p+'Week').value))}
function renderReports(){let a=filter('a'),g=aggregate(a);$('overview').textContent=`${g.n} 天｜銷售 ${sum(g.v)} 本｜售罄 ${sum(g.out)} 次`;let ps=$('aPlace').value?[$('aPlace').value]:places;$('stats').innerHTML='<table><tr><th>地點</th><th>天數</th>'+types.map(t=>`<th>${t}</th>`).join('')+'<th>合計</th><th>日均</th></tr>'+ps.map(p=>{let x=aggregate(a.filter(r=>r.place===p));return `<tr><td>${esc(p)}</td><td>${x.n}</td>${x.v.map(v=>`<td>${v}</td>`).join('')}<td>${sum(x.v)}</td><td>${x.n?(sum(x.v)/x.n).toFixed(1):'—'}</td></tr>`}).join('')+'</table>';$('shares').innerHTML=ps.map(p=>{let x=aggregate(a.filter(r=>r.place===p)),s=sum(x.v);return `<h3>${esc(p)}</h3>`+(!x.n?'<p>尚無紀錄</p>':types.map((t,i)=>`<div class="line"><span>${t}</span><div class="bar"><i style="width:${s?x.v[i]/s*100:0}%;background:${colors[i]}"></i></div><small>${s?(x.v[i]/s*100).toFixed(1):'0'}%</small><small>售罄 ${x.out[i]} 次</small></div>`).join(''))}).join('');let h=filter('h').sort((a,b)=>b.year-a.year||seasons.indexOf(b.season)-seasons.indexOf(a.season)||b.day-a.day),size=Number($('pageSize').value),pages=Math.max(1,Math.ceil(h.length/size));page=Math.min(page,pages);$('pageInfo').textContent=`${page} / ${pages} 頁・${h.length} 筆`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('records').innerHTML=h.length?'<table><tr><th>日期</th><th>星期</th><th>地點</th>'+types.map(t=>`<th>${t}</th>`).join('')+'<th>合計</th><th>操作</th></tr>'+h.slice((page-1)*size,page*size).map(r=>`<tr><td>${r.year}年 ${r.season}${r.day}日</td><td>${esc(r.week||'未設定')}</td><td>${esc(r.place)}</td>${r.v.map((v,i)=>`<td>${v}${r.out[i]?' <span class="danger" title="售罄">★</span>':''}</td>`).join('')}<td>${sum(r.v)}</td><td><button data-edit="${esc(r.id)}">編輯</button> <button data-del="${esc(r.id)}">刪除</button></td></tr>`).join('')+'</table><small>★ 表示售罄</small>':'<p>尚無符合條件的紀錄。</p>'}
$('pageSize').onchange=()=>{page=1;renderReports()};$('prev').onclick=()=>{page--;renderReports()};$('next').onclick=()=>{page++;renderReports()};
function updateTotal(){$('soldTotal').textContent=sum(types.map((_,i)=>Number($('v'+i).value)||0))}$('inputs').oninput=updateTotal;
function reset(){editing=null;$('formtitle').textContent='新增銷售紀錄';$('cancel').hidden=true;types.forEach((_,i)=>{$('v'+i).value=0;$('o'+i).checked=false});updateTotal()}
$('cancel').onclick=()=>{reset();refresh()};$('addPlace').onclick=()=>{let p=prompt('輸入新地點名稱')?.trim();if(!p)return;if(!places.includes(p)){places.push(p);save();refresh()}if(inactive.includes(p)){inactive=inactive.filter(x=>x!==p);save();refresh()}$('place').value=p};
$('entry').onsubmit=e=>{e.preventDefault();let r={id:editing??(globalThis.crypto?.randomUUID?.()||String(Date.now())),year:Number($('year').value),season:$('season').value,day:Number($('day').value),week:weeks.includes($('week').value)?$('week').value:'',place:$('place').value,v:types.map((_,i)=>Number($('v'+i).value)),out:types.map((_,i)=>$('o'+i).checked)};if(!validInt(r.year,1)||!validInt(r.day,1)||!r.v.every(v=>validInt(v))||!r.place){alert('請確認必填欄位及整數數量。');return}if(r.out.some((x,i)=>x&&!r.v[i])){alert('售罄必須有實際銷量；未攜帶不等於售罄。');return}let dup=rows.find(x=>x.id!==editing&&dateKey(x)===dateKey(r));if(dup&&!confirm('此日期已有紀錄，是否覆蓋？'))return;let wasEditing=editing!==null;rows=rows.filter(x=>x.id!==editing&&x.id!==dup?.id);rows.push(r);let ok=save();reset();if(!wasEditing){$('day').value=r.day+1;$('week').value=r.week?weeks[(weeks.indexOf(r.week)+1)%7]:'未設定';}refresh();$('msg').textContent=ok?'已儲存銷售紀錄。':'已更新，請立即匯出備份。'};
$('records').onclick=e=>{let d=e.target.dataset;if(d.edit!==undefined){let r=rows.find(x=>x.id===d.edit);if(!r)return;editing=r.id;refresh();$('year').value=r.year;$('season').value=r.season;$('day').value=r.day;$('week').value=r.week||'未設定';$('place').value=r.place;r.v.forEach((v,i)=>{$('v'+i).value=v;$('o'+i).checked=r.out[i]});$('formtitle').textContent='編輯銷售紀錄';$('cancel').hidden=false;updateTotal();switchTab('daily');$('entry').scrollIntoView({behavior:'smooth'})}if(d.del!==undefined&&confirm('確定刪除此筆紀錄？')){rows=rows.filter(r=>r.id!==d.del);if(editing===d.del)reset();save();refresh()}};

function renderPlaces(){ $('placeList').innerHTML=places.map((p,i)=>`<div style="margin:10px 0"><strong>${esc(p)}</strong> <small>${rows.filter(r=>r.place===p).length} 筆紀錄${inactive.includes(p)?'｜已停用':''}</small><div class="actions"><button type="button" data-rename="${i}">編輯</button><button type="button" data-toggle="${i}">${inactive.includes(p)?'恢復':'停用'}</button><button type="button" data-remove="${i}" ${rows.some(r=>r.place===p)?'disabled title="有歷史紀錄，請改用停用"':''}>刪除</button></div></div>`).join('')||'<p>尚無地點</p>'}
$('managePlace').onclick=()=>{$('placeManager').hidden=false;renderPlaces()};$('closePlaces').onclick=()=>{$('placeManager').hidden=true};
$('placeList').onclick=e=>{let d=e.target.dataset,idx=d.rename??d.toggle??d.remove;if(idx===undefined)return;let p=places[Number(idx)];if(p===undefined)return;let selections=['target','place','aPlace','hPlace'].filter(id=>$(id).value===p);if(d.rename!==undefined){let n=prompt('編輯地點名稱',p)?.trim();if(!n||n===p)return;if(places.includes(n)){alert('地點名稱已存在。');return}places=places.map(x=>x===p?n:x);inactive=inactive.map(x=>x===p?n:x);rows=rows.map(r=>r.place===p?{...r,place:n}:r);save();refresh();for(let id of selections)if([...$(id).options].some(o=>o.value===n))$(id).value=n;calc();renderReports();return}if(d.toggle!==undefined){inactive=inactive.includes(p)?inactive.filter(x=>x!==p):[...inactive,p]}else{if(rows.some(r=>r.place===p)||!confirm('確定刪除地點「'+p+'」？'))return;places=places.filter(x=>x!==p);inactive=inactive.filter(x=>x!==p)}save();refresh()};
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('export').onclick=()=>download('book-sales-backup.json',JSON.stringify({version:4,places,rows,inactive},null,2),'application/json');$('csv').onclick=()=>{let q=v=>'"'+String(v).replace(/"/g,'""')+'"';let data=[['年份','季節','日期','星期','地點',...types,...types.map(t=>t+'售罄'),'合計'],...rows.map(r=>[r.year,r.season,r.day,r.week||'未設定',/^[=+@-]/.test(r.place)?"'"+r.place:r.place,...r.v,...r.out.map(x=>x?'是':'否'),sum(r.v)])];download('book-sales.csv','\ufeff'+data.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let f=$('file').files[0];if(!f)return;let d=validate(JSON.parse(await f.text()));if(confirm('匯入將取代目前全部資料，確定繼續？')){rows=d.rows;places=d.places;inactive=d.inactive;reset();page=1;save();refresh()}}catch(e){alert('無法匯入：'+e.message)}finally{$('file').value=''}};refresh();
</script></body></html>
